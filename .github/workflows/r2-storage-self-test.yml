name: Verify deployed R2 binding

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: getpatched-index-build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the deployed Worker R2 binding
        run: python3 scripts/verify-r2-binding.py
