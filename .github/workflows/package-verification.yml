name: Package build and installed regressions
run-name: Verify ${{ inputs.package }} at ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to verify
        type: choice
        required: true
        options: [libxml2, libarchive]
      source_commit:
        description: Full commit SHA on the package's aptto/focal branch
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(format('["{0}"]', inputs.package)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: apt-to/packaging-${{ matrix.package }}
          ref: ${{ inputs.source_commit }}
          path: packaging
          persist-credentials: false
      - name: Verify source commit is pinned and on aptto/focal
        working-directory: packaging
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_commit must be a full 40-character commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT,,}"
          git fetch --no-tags origin refs/heads/aptto/focal
          git merge-base --is-ancestor "$SOURCE_COMMIT" FETCH_HEAD
      - name: Build and verify without publishing binaries
        run: python3 scripts/build-package.py --source packaging --output build/output
      - name: Retain reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/output/*.json
            build/output/*.txt
            build/output/*.tsv
            build/output/*.buildinfo
          if-no-files-found: warn
          retention-days: 30
      - name: Retain complete public source packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/output/source/*
          if-no-files-found: warn
          retention-days: 30
