name: Platform quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check catalogue and package policy consistency
        run: python3 -B -m unittest discover -s verification -p 'test_catalogue.py' -v
      - name: Check catalogue JavaScript syntax
        run: node --check site/catalogue.js
