name: Platform quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned Poppler package recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: getpatched/packaging-poppler
          ref: 08a8c260a334482fd89b9612dbc5bcaaa7246771
          path: packaging-poppler
          persist-credentials: false
      - name: Check package policies and release verification contracts
        run: python3 -B -m unittest discover -s verification -p 'test_*.py' -v
      - name: Check catalogue JavaScript syntax
        run: node --check site/catalogue.js
      - name: Check sponsor account interface behavior
        run: |
          node --test verification/test_site_account_ui.mjs
          node --test verification/test_site_account_oauth_unconfigured.mjs
      - name: Check release worker syntax and state adapter
        run: |
          node --check worker/src/index.js
          node --test worker/test/*.test.js
      - name: Validate production Worker bundle without deploying
        working-directory: worker
        run: npx --yes wrangler@4.151.3 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" --config wrangler.jsonc
