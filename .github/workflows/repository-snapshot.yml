name: Publish signed APT repository snapshots

on:
  workflow_run:
    workflows: [Private binary staging]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aptto-repository-snapshots
  cancel-in-progress: false

jobs:
  build-indexes:
    if: >-
      vars.APTTO_REPOSITORY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.repository.full_name == 'apt-to/platform'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: aptto-index-build
    permissions:
      contents: read
      id-token: write
    outputs:
      snapshot_ids: ${{ steps.build.outputs.snapshot_ids }}
    steps:
      - name: Check out trusted snapshot publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install focal repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils dpkg-dev xz-utils
      - name: Assemble and privately stage unsigned indexes
        id: build
        env:
          APTTO_RELEASE_ENDPOINT: https://repo.apt.to
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-apt-snapshot.py --channel both | tee snapshot-builds.jsonl
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path("snapshot-builds.jsonl").read_text().splitlines()]
          if {row.get("channel") for row in rows} != {"public", "early"} or any(not row.get("snapshot_build") for row in rows):
              raise SystemExit("builder did not return exactly the public and early snapshot IDs")
          print("snapshot_ids=" + json.dumps({row["channel"]: row["snapshot_build"] for row in rows}, separators=(",", ":")))
          PY

  sign-and-publish:
    needs: build-indexes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aptto-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted snapshot signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install signing tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnupg
      - name: Verify, sign and atomically publish snapshots
        env:
          APTTO_RELEASE_ENDPOINT: https://repo.apt.to
          APTTO_SIGNING_KEY_ARMORED: ${{ secrets.APTTO_SIGNING_KEY_ARMORED }}
          APTTO_SIGNING_FINGERPRINT: ${{ vars.APTTO_SIGNING_FINGERPRINT }}
          APTTO_SNAPSHOT_IDS: ${{ needs.build-indexes.outputs.snapshot_ids }}
        run: python3 scripts/sign-and-publish-apt-snapshot.py --channel both
