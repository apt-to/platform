name: Debian snapshot HTTPS diagnostics
run-name: Check Debian snapshot HTTPS at ${{ inputs.timestamp }}

on:
  workflow_dispatch:
    inputs:
      timestamp:
        description: Pinned Debian snapshot timestamp in UTC
        type: string
        required: true
        default: 20261030T000000Z

permissions:
  contents: read

jobs:
  snapshot-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify HTTPS and compare snapshot metadata across official endpoints
        env:
          SNAPSHOT_TIMESTAMP: ${{ inputs.timestamp }}
        run: |
          set -euo pipefail
          if [[ ! "$SNAPSHOT_TIMESTAMP" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "timestamp must use YYYYMMDDTHHMMSSZ" >&2
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/snapshot-tls"
          report="$RUNNER_TEMP/snapshot-tls/report.tsv"
          printf 'host\tinrelease_sha256\ttls\n' > "$report"
          for host in snapshot.debian.org snapshot-fastly.debian.org snapshot-cloudflare.debian.org; do
            echo "Checking verified TLS for $host"
            openssl s_client -connect "$host:443" -servername "$host" \
              -verify_hostname "$host" -verify_return_error \
              -CAfile /etc/ssl/certs/ca-certificates.crt \
              -brief </dev/null
            path="/archive/debian/${SNAPSHOT_TIMESTAMP}/dists/trixie/InRelease"
            curl --fail --silent --show-error --max-redirs 0 \
              "https://${host}${path}" -o "$RUNNER_TEMP/snapshot-tls/${host}.InRelease"
            digest="$(sha256sum "$RUNNER_TEMP/snapshot-tls/${host}.InRelease" | awk '{print $1}')"
            printf '%s\t%s\tverified\n' "$host" "$digest" | tee -a "$report"
          done
          cut -f2 "$report" | tail -n +2 | sort -u | wc -l | grep -qx '1'
          echo "All endpoints served byte-identical InRelease metadata for the pinned snapshot."
      - name: Retain TLS and metadata comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-snapshot-tls-${{ inputs.timestamp }}-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot-tls/report.tsv
          if-no-files-found: warn
          retention-days: 30
